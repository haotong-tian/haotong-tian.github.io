<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Haotong Tian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-section {
            padding: 5rem 0;
        }

        .contact-section p.lead {
            font-size: 1.08rem;
            font-weight: 300;
            color: var(--text-muted);
            max-width: 480px;
            line-height: 1.7;
            margin-bottom: 3rem;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            max-width: 560px;
        }

        .contact-card {
            padding: 1.8rem;
            border: 1px solid var(--rule);
            border-radius: 6px;
            transition: all 0.25s;
        }

        .contact-card:hover {
            border-color: var(--link);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 23, 20, 0.06);
        }

        .contact-card .card-label {
            font-family: var(--mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin-bottom: 0.6rem;
        }

        .contact-card a {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }

        .contact-card a:hover {
            color: var(--link);
        }

        .contact-card a svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .contact-note {
            margin-top: 3rem;
            padding: 1.5rem 2rem;
            background: var(--bg-alt);
            border-radius: 6px;
            max-width: 560px;
        }

        .contact-note p {
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 300;
            line-height: 1.65;
        }

        @media (max-width: 680px) {
            .contact-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="work.html">Work</a></li>
            <li><a href="education.html">Education</a></li>
            <li><a href="misc.html">Misc</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <main>
        <header class="page-header">
            <div class="container">
                <h1>Let's connect.</h1>
                <p class="subtitle">Always open to interesting conversations, collaborations, and new ideas.</p>
            </div>
        </header>

        <section class="contact-section">
            <div class="container">
                <div class="contact-grid reveal">
                    <div class="contact-card">
                        <div class="card-label">Email</div>
                        <a href="mailto:victor.ht.tian@gmail.com">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                            victor.ht.tian@gmail.com
                        </a>
                    </div>
                    <div class="contact-card">
                        <div class="card-label">Work Email</div>
                        <a href="mailto:Tian.Haotong@bcg.com">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                            Tian.Haotong@bcg.com
                        </a>
                    </div>
                    <div class="contact-card">
                        <div class="card-label">LinkedIn</div>
                        <a href="https://www.linkedin.com/in/haotong-tian/" target="_blank">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg>
                            haotong-tian
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Haotong Tian</p>
        </div>
    </footer>

    <script>
        const nav = document.querySelector('nav');
        window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 20));
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
            });
        }, { threshold: 0.15 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>

</body>
</html>
