<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Log — Haotong Tian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
    <style>
        /* ── Flight map ───────────────────────── */
        .flight-map-section {
            padding-bottom: 3rem;
        }

        .flight-map-wrap {
            border: 1px solid var(--rule);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 1.5rem;
            position: relative;
            background: var(--bg);
        }

        #flight-map-container {
            position: relative;
        }

        #flight-map {
            width: 100%;
            height: 560px;
        }

        @media (max-width: 680px) {
            #flight-map { height: 380px; }
        }

        /* Tone the map controls to match the site palette */
        .maplibregl-ctrl-group {
            box-shadow: none !important;
            border: 1px solid var(--rule) !important;
            background: var(--bg) !important;
        }

        .maplibregl-ctrl-group button {
            background: var(--bg) !important;
        }

        .maplibregl-ctrl-attrib {
            font-family: var(--mono) !important;
            font-size: 0.62rem !important;
            background: rgba(250, 250, 247, 0.85) !important;
        }

        .maplibregl-ctrl-attrib a { color: var(--text-muted) !important; }

        /* ── Tooltip ──────────────────────────── */
        .map-tooltip {
            position: absolute;
            pointer-events: none;
            font-family: var(--mono);
            font-size: 0.72rem;
            padding: 5px 9px;
            background: var(--text);
            color: var(--bg);
            border-radius: 3px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 10;
        }

        /* ── Stats bar ────────────────────────── */
        .flight-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: var(--rule);
            border-top: 1px solid var(--rule);
        }

        .flight-stat {
            background: var(--bg);
            padding: 1.2rem 1rem;
            text-align: center;
        }

        .flight-stat .stat-value {
            font-family: var(--display);
            font-size: 1.6rem;
            color: var(--text);
            line-height: 1.2;
        }

        .flight-stat .stat-label {
            font-family: var(--mono);
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        /* ── Filter toggle ─────────────────────── */
        .flight-filter {
            display: flex;
            gap: 0;
            margin-top: 1.5rem;
            border: 1px solid var(--rule);
            border-radius: 5px;
            overflow: hidden;
            width: fit-content;
        }

        .flight-filter button {
            font-family: var(--mono);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            padding: 0.5rem 1.2rem;
            border: none;
            background: var(--bg);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .flight-filter button + button {
            border-left: 1px solid var(--rule);
        }

        .flight-filter button:hover {
            background: var(--bg-alt);
        }

        .flight-filter button.active {
            background: var(--text);
            color: var(--bg);
        }

        @media (max-width: 680px) {
            .flight-stats { grid-template-columns: repeat(2, 1fr); }
            .flight-stat .stat-value { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <nav>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="work.html">Work</a></li>
            <li><a href="education.html">Education</a></li>
            <li><a href="misc.html" class="active">Misc</a>
                <ul class="dropdown-menu">
                    <li><a href="releases.html">Releases</a></li>
                    <li><a href="flight-log.html">Flight Log</a></li>
                </ul>
            </li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>
        <header class="page-header">
            <div class="container">
                <h1>Flight Log</h1>
                <p class="subtitle">As a consultant I travel a lot — here's where the miles take me.</p>
            </div>
        </header>

        <section class="flight-map-section">
            <div class="container">
                <div class="section-label reveal">Flight Log</div>

                <div class="flight-filter reveal" id="flight-filter">
                    <button class="active" data-filter="since-aug-2025">Since Aug 2025</button>
                    <button data-filter="2026">2026</button>
                </div>

                <div class="flight-map-wrap reveal">
                    <div id="flight-map-container">
                        <div id="flight-map"></div>
                        <div class="map-tooltip" id="map-tooltip"></div>
                    </div>
                    <div class="flight-stats" id="flight-stats"></div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Haotong Tian</p>
        </div>
    </footer>

    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@turf/turf@7.2.0/turf.min.js"></script>
    <script src="flights.js"></script>
    <script>
        // ── Nav scroll & reveal ──────────────────
        const nav = document.querySelector('nav');
        window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 20));
        const obs = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
        }, { threshold: 0.15 });
        document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

        // ── Map setup ────────────────────────────
        const tooltip = document.getElementById('map-tooltip');
        const rootStyles = getComputedStyle(document.documentElement);
        const TEXT = rootStyles.getPropertyValue('--text').trim() || '#0D1B3E';
        const ACCENT = rootStyles.getPropertyValue('--accent').trim() || '#1D6A3A';

        const map = new maplibregl.Map({
            container: 'flight-map',
            style: 'https://tiles.openfreemap.org/styles/positron',
            center: [-150, 25],
            zoom: 1.2,
            minZoom: 0.5,
            maxZoom: 16,
            projection: 'globe',
            attributionControl: false,
        });

        map.addControl(new maplibregl.NavigationControl({ showCompass: false, visualizePitch: false }), 'top-right');
        map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
        map.dragRotate.disable();
        map.touchZoomRotate.disableRotation();
        map.keyboard.disable();

        // ── Haversine (km) ───────────────────────
        function haversineKm(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const toRad = d => d * Math.PI / 180;
            const dLat = toRad(lat2 - lat1);
            const dLng = toRad(lng2 - lng1);
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // ── Build geojson + stats for a filter ───
        function buildData(filter) {
            const filtered = FLIGHTS.filter(f => {
                if (filter === 'since-aug-2025') return f.date >= '2025-08';
                if (filter === '2026') return f.date >= '2026-01-01' && f.date < '2027-01-01';
                return true;
            });

            const routeCounts = {};
            const airportFlightCount = {};

            filtered.forEach(f => {
                const key = [f.from, f.to].sort().join('-');
                routeCounts[key] = routeCounts[key] || { from: f.from, to: f.to, count: 0 };
                routeCounts[key].count++;
                airportFlightCount[f.from] = (airportFlightCount[f.from] || 0) + 1;
                airportFlightCount[f.to] = (airportFlightCount[f.to] || 0) + 1;
            });

            const routes = Object.values(routeCounts);
            const maxTrips = Math.max(...routes.map(r => r.count), 1);
            const maxCount = Math.max(...Object.values(airportFlightCount), 1);

            const arcFeatures = routes.map(r => {
                const from = AIRPORTS[r.from], to = AIRPORTS[r.to];
                if (!from || !to) return null;
                const arc = turf.greatCircle(
                    turf.point([from.lng, from.lat]),
                    turf.point([to.lng, to.lat]),
                    { npoints: 128 }
                );
                arc.properties = {
                    count: r.count,
                    intensity: r.count / maxTrips,
                };
                return arc;
            }).filter(Boolean);

            const airportFeatures = Object.keys(airportFlightCount).map(code => {
                const ap = AIRPORTS[code];
                if (!ap) return null;
                const count = airportFlightCount[code];
                return {
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: [ap.lng, ap.lat] },
                    properties: {
                        code, city: ap.city, count,
                        sizeFrac: count / maxCount,
                    },
                };
            }).filter(Boolean);

            const totalFlights = filtered.length;
            const uniqueAirports = Object.keys(airportFlightCount).length;
            const uniqueRoutes = routes.length;
            const totalKm = filtered.reduce((s, f) => {
                const fr = AIRPORTS[f.from], to = AIRPORTS[f.to];
                if (!fr || !to) return s;
                return s + haversineKm(fr.lat, fr.lng, to.lat, to.lng);
            }, 0);

            return {
                arcs: { type: 'FeatureCollection', features: arcFeatures },
                airports: { type: 'FeatureCollection', features: airportFeatures },
                stats: { totalFlights, uniqueAirports, uniqueRoutes, totalKm },
            };
        }

        function renderStats(stats) {
            document.getElementById('flight-stats').innerHTML = [
                { value: stats.totalFlights.toLocaleString(), label: "Total Flights" },
                { value: stats.uniqueAirports.toLocaleString(), label: "Airports" },
                { value: stats.uniqueRoutes.toLocaleString(), label: "Routes" },
                { value: Math.round(stats.totalKm).toLocaleString() + " km", label: "Distance Flown" },
            ].map(s => `
                <div class="flight-stat">
                    <div class="stat-value">${s.value}</div>
                    <div class="stat-label">${s.label}</div>
                </div>
            `).join('');
        }

        function applyFilter(filter) {
            const data = buildData(filter);
            if (map.getSource('flight-arcs')) {
                map.getSource('flight-arcs').setData(data.arcs);
                map.getSource('airports').setData(data.airports);
            }
            renderStats(data.stats);
        }

        map.on('load', () => {
            // Atmosphere — paper-warm fog around the globe
            try {
                map.setSky({
                    'sky-color': '#f1ece3',
                    'sky-horizon-blend': 0.5,
                    'horizon-color': '#bbb6ab',
                    'horizon-fog-blend': 0.6,
                    'fog-color': '#dfd8c9',
                    'fog-ground-blend': 0.3,
                    'atmosphere-blend': 0.6,
                });
            } catch (e) { /* older MapLibre — ignore */ }

            const initial = buildData('since-aug-2025');

            map.addSource('flight-arcs', { type: 'geojson', data: initial.arcs });
            map.addSource('airports', { type: 'geojson', data: initial.airports });

            map.addLayer({
                id: 'flight-arcs',
                type: 'line',
                source: 'flight-arcs',
                layout: { 'line-cap': 'round', 'line-join': 'round' },
                paint: {
                    'line-color': TEXT,
                    'line-width': [
                        'interpolate', ['linear'], ['get', 'intensity'],
                        0, 0.9, 1, 2.4
                    ],
                    'line-opacity': [
                        'interpolate', ['linear'], ['get', 'intensity'],
                        0, 0.4, 1, 0.78
                    ],
                },
            });

            map.addLayer({
                id: 'airport-dots',
                type: 'circle',
                source: 'airports',
                paint: {
                    'circle-radius': [
                        'interpolate', ['linear'], ['get', 'sizeFrac'],
                        0, 3, 1, 7
                    ],
                    'circle-color': ACCENT,
                    'circle-stroke-color': '#fff',
                    'circle-stroke-width': 1.2,
                    'circle-pitch-alignment': 'map',
                },
            });

            renderStats(initial.stats);

            // ── Tooltip on hover ─────────────────
            map.on('mouseenter', 'airport-dots', () => {
                map.getCanvas().style.cursor = 'pointer';
            });
            map.on('mouseleave', 'airport-dots', () => {
                map.getCanvas().style.cursor = '';
                tooltip.style.opacity = '0';
            });
            map.on('mousemove', 'airport-dots', (e) => {
                if (!e.features || !e.features.length) return;
                const p = e.features[0].properties;
                tooltip.innerHTML = `${p.code} &middot; ${p.city}<br>${p.count} flight${p.count !== 1 ? 's' : ''}`;
                tooltip.style.opacity = '1';
                tooltip.style.left = (e.point.x - tooltip.offsetWidth / 2) + 'px';
                tooltip.style.top = (e.point.y - 14 - tooltip.offsetHeight) + 'px';
            });
        });

        // ── Filter toggle ────────────────────────
        document.querySelectorAll('#flight-filter button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelector('#flight-filter button.active').classList.remove('active');
                btn.classList.add('active');
                applyFilter(btn.dataset.filter);
            });
        });
    </script>

</body>
</html>
