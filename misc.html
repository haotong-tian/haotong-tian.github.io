<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miscellaneous — Haotong Tian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .hub-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            padding: 4rem 0;
        }

        .hub-card {
            display: block;
            padding: 2.5rem 2rem;
            border: 1px solid var(--rule);
            border-radius: 8px;
            transition: all 0.25s;
            text-decoration: none;
            color: var(--text);
            position: relative;
            overflow: hidden;
        }

        .hub-card:hover {
            border-color: var(--text);
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(13, 27, 62, 0.06);
            color: var(--text);
        }

        .hub-card .card-icon {
            font-size: 2rem;
            margin-bottom: 1.2rem;
            display: block;
        }

        .hub-card h2 {
            font-family: var(--display);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .hub-card p {
            color: var(--text-muted);
            font-weight: 300;
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 1.2rem;
        }

        .hub-card .card-arrow {
            font-family: var(--mono);
            font-size: 0.78rem;
            color: var(--text-muted);
            transition: color 0.2s, transform 0.2s;
            display: inline-block;
        }

        .hub-card:hover .card-arrow {
            color: var(--text);
            transform: translateX(4px);
        }

        @media (max-width: 680px) {
            .hub-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="work.html">Work</a></li>
            <li><a href="education.html">Education</a></li>
            <li><a href="misc.html" class="active">Misc</a>
                <ul class="dropdown-menu">
                    <li><a href="releases.html">Releases</a></li>
                    <li><a href="flight-log.html">Flight Log</a></li>
                </ul>
            </li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>
        <header class="page-header">
            <div class="container">
                <h1>The rest of it.</h1>
                <p class="subtitle">Assorted things that don't fit elsewhere.</p>
            </div>
        </header>

        <div class="container">
            <div class="hub-grid">
                <a href="releases.html" class="hub-card reveal">
                    <span class="card-icon">&#9998;</span>
                    <h2>Releases</h2>
                    <p>Thoughts and updates.</p>
                    <span class="card-arrow">&rarr; Read posts</span>
                </a>

                <a href="flight-log.html" class="hub-card reveal">
                    <span class="card-icon">&#9992;</span>
                    <h2>Flight Log</h2>
                    <p>Where the miles take me.</p>
                    <span class="card-arrow">&rarr; View map</span>
                </a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Haotong Tian &nbsp;&middot;&nbsp; <a href="mailto:victor.ht.tian@gmail.com">victor.ht.tian@gmail.com</a></p>
        </div>
    </footer>

    <script>
        const nav = document.querySelector('nav');
        window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 20));
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
            });
        }, { threshold: 0.15 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>

</body>
</html>
